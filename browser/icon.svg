<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
    <defs>
        <radialGradient id="bg" cx="35%" cy="25%" r="85%">
            <stop offset="0" stop-color="#2e3a6e"/>
            <stop offset="0.55" stop-color="#151a33"/>
            <stop offset="1" stop-color="#07080f"/>
        </radialGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0.55" stop-color="#b7a6e6" stop-opacity="0.9"/>
            <stop offset="0.7" stop-color="#8f8fd6" stop-opacity="0.45"/>
            <stop offset="1" stop-color="#5b5fb0" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#f4f4fb"/>
            <stop offset="0.35" stop-color="#c9c3e8"/>
            <stop offset="0.7" stop-color="#e2b48f"/>
            <stop offset="1" stop-color="#f1c39c" stop-opacity="0.6"/>
        </linearGradient>
        <linearGradient id="jet" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#d9cfff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#d9cfff" stop-opacity="0.7"/>
            <stop offset="1" stop-color="#d9cfff" stop-opacity="0"/>
        </linearGradient>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.2"/>
        </filter>
        <clipPath id="top">
            <rect x="0" y="0" width="256" height="128"/>
        </clipPath>
        <clipPath id="bottom">
            <rect x="0" y="128" width="256" height="128"/>
        </clipPath>
        <clipPath id="round">
            <rect width="256" height="256" rx="56"/>
        </clipPath>
    </defs>

    <g clip-path="url(#round)">
        <rect width="256" height="256" fill="url(#bg)"/>

        <line x1="60" y1="210" x2="200" y2="40" stroke="url(#jet)" stroke-width="2" filter="url(#blur)"/>

        <g transform="rotate(-14 128 128)">
            <g clip-path="url(#top)">
                <ellipse cx="128" cy="128" rx="112" ry="26" fill="none" stroke="url(#disk)" stroke-width="9" opacity="0.75" filter="url(#blur)"/>
            </g>
        </g>

        <circle cx="128" cy="128" r="66" fill="url(#glow)"/>
        <circle cx="128" cy="128" r="46" fill="#000"/>
        <circle cx="128" cy="128" r="46" fill="none" stroke="#c8bdf0" stroke-width="1.6" opacity="0.8"/>

        <g transform="rotate(-14 128 128)">
            <g clip-path="url(#bottom)">
                <ellipse cx="128" cy="128" rx="112" ry="26" fill="none" stroke="url(#disk)" stroke-width="11" filter="url(#blur)"/>
                <ellipse cx="128" cy="128" rx="112" ry="26" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
            </g>
        </g>
    </g>
</svg>
