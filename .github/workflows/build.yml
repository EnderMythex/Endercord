name: Release
on:
    push:
        branches:
            - main
    workflow_run:
        workflows: ["Update Upstream"]
        types:
            - completed

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.BUILDS_TOKEN }}
    REPO: enzomtpYT/PawsomeBuilds
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build EnderCord
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PNPM
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in pawtop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/pawtop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload EnderCord Stable
              if: ${{ vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The installer and the updater read the build hash from the release title.
                  title="EnderCord $(git rev-parse HEAD)"
                  gh release view latest >/dev/null 2>&1 || gh release create latest --target "$(git rev-parse HEAD)" --title "$title" --notes "Latest EnderCord build, updated on every push to main."
                  gh release upload latest --clobber dist/release/*
                  gh release edit latest --title "$title"

            - name: Upload Plugin JSONs to Equibored repo
              if: github.repository == 'enzomtpYT/PawsomeVencord' && vars.ACT == 'false'
              run: |
                  git config --global user.name "GitHub-Actions"
                  git config --global user.email actions@github.com
                  git clone https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git plugins
                  cd plugins

                          cp ../dist/release/*plugins.json .
                  cp ../dist/release/devs.json .
                          git add -A

                  git commit -m "Plugins for https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
                  git push --force https://$USERNAME:$GITHUB_TOKEN@github.com/$REPO.git
